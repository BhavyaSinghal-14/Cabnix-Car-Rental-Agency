<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCF3CF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E4053"/>
      <stop offset="100%" stop-color="#1A252F"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#sky)"/>
  
  <!-- Sunrise behind Shimla ridges -->
  <circle cx="400" cy="220" r="120" fill="#F39C12" opacity="0.15"/>
  <circle cx="400" cy="220" r="30" fill="#FFFFFF" opacity="0.9"/>

  <!-- Back Hills -->
  <path d="M -50 400 Q 200 250, 450 310 Q 650 220, 850 400 Z" fill="#7FB3D5" opacity="0.4"/>
  <path d="M -100 400 Q 150 290, 390 320 Q 600 260, 900 400 Z" fill="#5499C7" opacity="0.6"/>

  <!-- Main Ridge with Clock Tower Silhouette -->
  <path d="M -50 420 L 250 350 L 320 350 L 320 250 L 330 250 L 330 200 L 340 180 L 350 200 L 350 250 L 360 250 L 360 350 L 550 340 L 850 430 L 850 500 L -50 500 Z" fill="url(#hills)"/>

  <!-- Additional House clusters on Ridge -->
  <g fill="#212F3D">
    <rect x="180" y="340" width="30" height="25" rx="2"/>
    <polygon points="175,340 195,325 215,340"/>
    <rect x="220" y="335" width="25" height="30" rx="2"/>
    <polygon points="215,335 232,320 250,335"/>
    <rect x="380" y="325" width="40" height="35" rx="2"/>
    <polygon points="375,325 400,305 425,325"/>
  </g>

  <!-- Pine Forests -->
  <g fill="#145A32">
    <polygon points="80,390 70,330 90,330"/>
    <polygon points="80,340 73,300 87,300"/>
    <polygon points="120,380 110,310 130,310"/>
    <polygon points="620,360 610,290 630,290"/>
    <polygon points="650,370 640,305 660,305"/>
  </g>

  <g transform="translate(400, 460)" text-anchor="middle">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#1A252F" letter-spacing="3">SHIMLA, HILLS</text>
  </g>
</svg>
