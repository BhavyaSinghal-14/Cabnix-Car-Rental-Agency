<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E9EDF0"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34495E"/>
      <stop offset="100%" stop-color="#2C3E50"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EEEEEE"/>
      <stop offset="50%" stop-color="#DCDCDC"/>
      <stop offset="100%" stop-color="#EEEEEE"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A4A4A"/>
      <stop offset="100%" stop-color="#1C1C1C"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3436" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E272C" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4B942"/>
      <stop offset="100%" stop-color="#D49922"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="24" fill="url(#skyGrad)"/>

  <!-- Minimal Decorative Circles -->
  <circle cx="700" cy="120" r="80" fill="#34495E" fill-opacity="0.04"/>
  <circle cx="150" cy="350" r="120" fill="#F4B942" fill-opacity="0.03"/>

  <!-- Ground / Road Shadow -->
  <ellipse cx="400" cy="400" rx="360" ry="12" fill="#000000" fill-opacity="0.1"/>
  <rect x="50" y="394" width="700" height="6" rx="3" fill="url(#roadGrad)"/>

  <!-- Subtle Hill Outline behind Sedan -->
  <path d="M 50 394 L 200 320 L 350 360 L 520 280 L 650 340 L 750 394 Z" fill="#E2E6EA" opacity="0.8"/>

  <!-- CAR DESIGN (Classic compact sedan side profile inspired by Dzire/Etios) -->
  <g transform="translate(160, 180)">
    <!-- Main Sedan Body -->
    <!-- Boot to roof to nose -->
    <path d="M 15 150 
             L 50 150
             L 60 120
             C 65 95, 80 75, 105 70
             L 145 65
             C 170 65, 230 65, 255 70
             C 275 75, 330 110, 350 128
             L 405 130
             C 415 132, 435 142, 440 160
             L 435 195
             L 415 200
             C 410 180, 385 180, 380 200
             L 155 200
             C 150 180, 125 180, 120 200
             L 25 200
             C 20 195, 15 180, 15 168 Z" fill="url(#carBody)"/>

    <!-- Front bumper and headlight detail -->
    <path d="M 420 142 C 430 145, 438 155, 440 165 L 420 165 Z" fill="url(#accentGrad)"/>
    
    <!-- Tail light detail -->
    <path d="M 18 135 C 14 135, 14 148, 22 150 Z" fill="#FF4757"/>

    <!-- Windows (Glossy Dark with divide) -->
    <path d="M 115 130 
             L 110 84
             C 112 76, 140 73, 168 73
             L 190 73
             L 190 130 Z" fill="url(#windowGrad)"/>
    <path d="M 198 130 
             L 198 73
             L 245 73
             C 260 83, 290 102, 305 130 Z" fill="url(#windowGrad)"/>

    <!-- Door Seams and Handles -->
    <line x1="194" y1="73" x2="194" y2="198" stroke="#1F2D3D" stroke-width="2"/>
    <line x1="110" y1="130" x2="310" y2="130" stroke="#1F2D3D" stroke-width="1.5" opacity="0.6"/>
    <rect x="155" y="110" width="22" height="6" rx="2" fill="#1C1C1C"/>
    <rect x="220" y="110" width="22" height="6" rx="2" fill="#1C1C1C"/>

    <!-- Wheel Arches -->
    <path d="M 110 200 C 110 170, 165 170, 165 200 Z" fill="#1A2530"/>
    <path d="M 370 200 C 370 170, 425 170, 425 200 Z" fill="#1A2530"/>

    <!-- Wheels (Detailed Alloy Design) -->
    <!-- Rear Wheel -->
    <g transform="translate(137, 200)">
      <circle cx="0" cy="0" r="32" fill="url(#wheelGrad)"/>
      <circle cx="0" cy="0" r="22" fill="#CCCCCC" stroke="#4A4A4A" stroke-width="3"/>
      <!-- Spokes -->
      <line x1="0" y1="-22" x2="0" y2="22" stroke="#333333" stroke-width="2"/>
      <line x1="-22" y1="0" x2="22" y2="0" stroke="#333333" stroke-width="2"/>
      <line x1="-15" y1="-15" x2="15" y2="15" stroke="#333333" stroke-width="2"/>
      <line x1="15" y1="-15" x2="-15" y2="15" stroke="#333333" stroke-width="2"/>
      <circle cx="0" cy="0" r="8" fill="#34495E"/>
    </g>
    <!-- Front Wheel -->
    <g transform="translate(397, 200)">
      <circle cx="0" cy="0" r="32" fill="url(#wheelGrad)"/>
      <circle cx="0" cy="0" r="22" fill="#CCCCCC" stroke="#4A4A4A" stroke-width="3"/>
      <!-- Spokes -->
      <line x1="0" y1="-22" x2="0" y2="22" stroke="#333333" stroke-width="2"/>
      <line x1="-22" y1="0" x2="22" y2="0" stroke="#333333" stroke-width="2"/>
      <line x1="-15" y1="-15" x2="15" y2="15" stroke="#333333" stroke-width="2"/>
      <line x1="15" y1="-15" x2="-15" y2="15" stroke="#333333" stroke-width="2"/>
      <circle cx="0" cy="0" r="8" fill="#34495E"/>
    </g>
  </g>

  <!-- Title or Branding Elements -->
  <g transform="translate(400, 440)" text-anchor="middle">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#34495E" letter-spacing="4">CABNIX SEDAN CLASS</text>
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="12" fill="#2D3436" opacity="0.6" y="20">Maruti Dzire, Toyota Etios or Equivalent Comfort Fleet</text>
  </g>
</svg>
