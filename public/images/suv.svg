<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E1ECF0"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E375A"/>
      <stop offset="100%" stop-color="#122239"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EEEEEE"/>
      <stop offset="50%" stop-color="#DCDCDC"/>
      <stop offset="100%" stop-color="#EEEEEE"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A4A4A"/>
      <stop offset="100%" stop-color="#1C1C1C"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182026" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0E1217" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4B942"/>
      <stop offset="100%" stop-color="#D49922"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="24" fill="url(#skyGrad)"/>

  <!-- Minimal Decorative Circles -->
  <circle cx="700" cy="120" r="80" fill="#1E375A" fill-opacity="0.04"/>
  <circle cx="150" cy="350" r="120" fill="#F4B942" fill-opacity="0.03"/>

  <!-- Ground / Road Shadow -->
  <ellipse cx="400" cy="400" rx="370" ry="12" fill="#000000" fill-opacity="0.1"/>
  <rect x="50" y="394" width="700" height="6" rx="3" fill="url(#roadGrad)"/>

  <!-- Steep Mountain Peaks for SUV -->
  <path d="M 50 394 L 220 230 L 380 320 L 580 180 L 700 300 L 750 394 Z" fill="#D0DEE5" opacity="0.8"/>
  <path d="M 120 394 L 280 200 L 410 290 L 500 220 L 640 340 L 750 394 Z" fill="#E6EEF2" opacity="0.6"/>

  <!-- CAR DESIGN (Modern Premium SUV inspired by Toyota Innova Crysta / Fortuner silhouette) -->
  <g transform="translate(140, 150)">
    <!-- Main SUV Body -->
    <!-- Rear spoiler - roof - bonnet - nose - side skirts -->
    <path d="M 10 160 
             L 20 58
             C 25 55, 35 55, 45 55
             L 320 55
             C 340 55, 360 70, 375 82
             L 420 102
             C 440 110, 485 120, 500 135
             C 512 145, 515 168, 510 180
             L 495 195
             L 475 200
             C 470 174, 435 174, 430 200
             L 185 200
             C 180 174, 145 174, 140 200
             L 25 200
             C 20 195, 10 185, 10 168 Z" fill="url(#carBody)"/>

    <!-- Front bumper and headlight detail -->
    <path d="M 490 132 C 500 135, 512 145, 510 158 L 492 158 Z" fill="url(#accentGrad)"/>
    
    <!-- Large Tail light detail -->
    <path d="M 14 62 C 10 65, 10 85, 18 90 Z" fill="#FF4757"/>

    <!-- Windows (Big SUV Pillars with 3 parts) -->
    <!-- Front window -->
    <path d="M 245 120 
             L 240 68
             C 242 62, 280 62, 310 62
             L 322 62
             C 335 68, 350 82, 362 100
             L 362 120 Z" fill="url(#windowGrad)"/>
    <!-- Middle window -->
    <path d="M 136 120 
             L 136 68
             L 232 68
             L 232 120 Z" fill="url(#windowGrad)"/>
    <!-- Back window -->
    <path d="M 45 120 
             L 50 68
             L 126 68
             L 126 120 Z" fill="url(#windowGrad)"/>

    <!-- Door Seams, Pillars, Handles -->
    <line x1="131" y1="68" x2="131" y2="198" stroke="#0F1D30" stroke-width="3"/>
    <line x1="238" y1="68" x2="238" y2="198" stroke="#0F1D30" stroke-width="3"/>
    <line x1="38" y1="120" x2="370" y2="120" stroke="#0F1D30" stroke-width="1.5" opacity="0.6"/>
    <rect x="80" y="100" width="24" height="6" rx="2" fill="#1C1C1C"/>
    <rect x="165" y="100" width="24" height="6" rx="2" fill="#1C1C1C"/>
    <rect x="255" y="100" width="24" height="6" rx="2" fill="#1C1C1C"/>

    <!-- Rugged Wheel Arches -->
    <path d="M 130 200 C 130 162, 195 162, 195 200 Z" fill="#0C1420"/>
    <path d="M 420 200 C 420 162, 485 162, 485 200 Z" fill="#0C1420"/>

    <!-- Big SUV Wheels (Premium Off-road style alloys) -->
    <!-- Rear Wheel -->
    <g transform="translate(162, 200)">
      <circle cx="0" cy="0" r="38" fill="url(#wheelGrad)"/>
      <circle cx="0" cy="0" r="26" fill="#CCCCCC" stroke="#333333" stroke-width="4"/>
      <!-- Spokes -->
      <line x1="0" y1="-26" x2="0" y2="26" stroke="#222222" stroke-width="3"/>
      <line x1="-26" y1="0" x2="26" y2="0" stroke="#222222" stroke-width="3"/>
      <line x1="-18" y1="-18" x2="18" y2="18" stroke="#222222" stroke-width="2"/>
      <line x1="18" y1="-18" x2="-18" y2="18" stroke="#222222" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="#1E375A"/>
    </g>
    <!-- Front Wheel -->
    <g transform="translate(452, 200)">
      <circle cx="0" cy="0" r="38" fill="url(#wheelGrad)"/>
      <circle cx="0" cy="0" r="26" fill="#CCCCCC" stroke="#333333" stroke-width="4"/>
      <!-- Spokes -->
      <line x1="0" y1="-26" x2="0" y2="26" stroke="#222222" stroke-width="3"/>
      <line x1="-26" y1="0" x2="26" y2="0" stroke="#222222" stroke-width="3"/>
      <line x1="-18" y1="-18" x2="18" y2="18" stroke="#222222" stroke-width="2"/>
      <line x1="18" y1="-18" x2="-18" y2="18" stroke="#222222" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="#1E375A"/>
    </g>
  </g>

  <!-- Title or Branding Elements -->
  <g transform="translate(400, 440)" text-anchor="middle">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#1E375A" letter-spacing="4">CABNIX SUV CLASS</text>
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="12" fill="#2D3436" opacity="0.6" y="20">Toyota Innova Crysta, Fortuner or Equivalent Premium MUV/SUV</text>
  </g>
</svg>
