<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C3E50"/>
      <stop offset="50%" stop-color="#34495E"/>
      <stop offset="100%" stop-color="#5DADE2"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F618D"/>
      <stop offset="100%" stop-color="#1A5276"/>
    </linearGradient>
    <linearGradient id="palaceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2F3F4"/>
      <stop offset="100%" stop-color="#BDC3C7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#sky)"/>
  
  <circle cx="400" cy="270" r="160" fill="#F39C12" opacity="0.1"/>

  <!-- Romantic hills backdrop -->
  <path d="M -50 350 Q 200 240, 450 320 T 850 350 L 850 500 L -50 500 Z" fill="#2E4053" opacity="0.7"/>

  <!-- Lake Pichola water -->
  <rect x="0" y="320" width="800" height="180" fill="url(#lake)"/>

  <!-- White Marble Lake Palace silhouette floating on water -->
  <g transform="translate(180, 240)">
    <rect x="40" y="50" width="360" height="40" fill="url(#palaceGrad)" rx="2"/>
    <rect x="60" y="20" width="100" height="30" fill="url(#palaceGrad)" rx="2"/>
    <rect x="280" y="20" width="100" height="30" fill="url(#palaceGrad)" rx="2"/>
    
    <!-- Royal dome towers on palace -->
    <path d="M 95 20 Q 110 2, 125 20 Z" fill="#7F8C8D"/>
    <path d="M 315 20 Q 330 2, 345 20 Z" fill="#7F8C8D"/>
    
    <!-- Beautiful arched windows glowing warmly -->
    <g fill="#F1C40F" opacity="0.9">
      <rect x="80" y="28" width="10" height="15" rx="2"/>
      <rect x="100" y="28" width="10" height="15" rx="2"/>
      <rect x="120" y="28" width="10" height="15" rx="2"/>
      
      <rect x="300" y="28" width="10" height="15" rx="2"/>
      <rect x="320" y="28" width="10" height="15" rx="2"/>
      <rect x="340" y="28" width="10" height="15" rx="2"/>
      
      <rect x="160" y="60" width="12" height="20" rx="2"/>
      <rect x="200" y="60" width="12" height="20" rx="2"/>
      <rect x="240" y="60" width="12" height="20" rx="2"/>
      <rect x="280" y="60" width="12" height="20" rx="2"/>
    </g>

    <!-- Glowing reflection in Pichola lake -->
    <rect x="40" y="92" width="360" height="20" fill="#F1C40F" opacity="0.15" filter="blur(2px)"/>
  </g>

  <!-- Water ripple sparks -->
  <line x1="80" y1="360" x2="210" y2="360" stroke="#5DADE2" stroke-width="2" opacity="0.4"/>
  <line x1="480" y1="400" x2="680" y2="400" stroke="#5DADE2" stroke-width="1.5" opacity="0.4"/>

  <g transform="translate(400, 460)" text-anchor="middle">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#EBF5FB" letter-spacing="3">UDAIPUR, LAKES</text>
  </g>
</svg>
