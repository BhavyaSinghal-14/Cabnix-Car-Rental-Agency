<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E59866"/>
      <stop offset="50%" stop-color="#F8C471"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="mount" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F618D"/>
      <stop offset="100%" stop-color="#154360"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#sky)"/>
  
  <!-- Glowing sunset ball -->
  <circle cx="200" cy="200" r="80" fill="#F39C12" opacity="0.3"/>
  <circle cx="200" cy="200" r="30" fill="#FFFFF0" opacity="0.95"/>

  <!-- Layered Blue Ridge Mountains (Misty Ridge lines) -->
  <path d="M -50 400 Q 200 220, 500 310 T 850 400 L 850 500 L -50 500 Z" fill="#2E86C1" opacity="0.4"/>
  <path d="M -100 420 Q 150 260, 450 330 T 900 420 L 900 500 L -100 500 Z" fill="#2874A6" opacity="0.6"/>
  <path d="M -150 440 Q 250 300, 520 360 T 950 440 L 950 500 L -150 500 Z" fill="url(#mount)"/>

  <!-- Clouds floating in the mountain valleys -->
  <ellipse cx="120" cy="380" rx="60" ry="20" fill="#FFFFFF" opacity="0.5"/>
  <ellipse cx="150" cy="390" rx="80" ry="25" fill="#FFFFFF" opacity="0.4"/>
  <ellipse cx="650" cy="400" rx="90" ry="25" fill="#FFFFFF" opacity="0.5"/>
  <ellipse cx="600" cy="410" rx="70" ry="20" fill="#FFFFFF" opacity="0.4"/>

  <g transform="translate(400, 460)" text-anchor="middle">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#1B4F72" letter-spacing="3">MUSSOORIE, RIDGE</text>
  </g>
</svg>
