<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E86C1"/>
      <stop offset="100%" stop-color="#EBF5FB"/>
    </linearGradient>
    <linearGradient id="desert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4AC0D"/>
      <stop offset="100%" stop-color="#7D6608"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#sky)"/>
  
  <circle cx="120" cy="120" r="40" fill="#F4D03F" opacity="0.9"/>

  <!-- High brown rugged mountains -->
  <polygon points="-50,400 150,160 380,400" fill="url(#desert)"/>
  <polygon points="150,160 110,210 145,215" fill="#D5D8DC" opacity="0.7"/> <!-- Mountain top dry details -->

  <polygon points="250,400 520,120 750,400" fill="#A04000"/>
  <polygon points="520,120 480,180 505,185" fill="#D5D8DC" opacity="0.7"/>

  <polygon points="50,410 320,200 520,410" fill="#9A7D0A" opacity="0.8"/>

  <!-- Famous high-altitude cobalt blue lake (Pangong Lake) reflection -->
  <rect x="0" y="380" width="800" height="120" fill="#1B4F72"/>
  <path d="M 0 380 Q 250 365, 450 380 T 800 380 L 800 500 L 0 500 Z" fill="#21618C"/>

  <!-- Soft reflection highlights of mountains -->
  <polygon points="100,380 180,430 260,380" fill="#7D6608" opacity="0.15"/>
  <polygon points="400,380 480,440 560,380" fill="#A04000" opacity="0.15"/>

  <!-- Ripple lines -->
  <line x1="80" y1="410" x2="220" y2="410" stroke="#AED6F1" stroke-width="2" opacity="0.4"/>
  <line x1="450" y1="430" x2="650" y2="430" stroke="#AED6F1" stroke-width="1.5" opacity="0.4"/>

  <g transform="translate(400, 460)" text-anchor="middle">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#FDFEFE" letter-spacing="3">LEH LADAKH, HIGH RANGE</text>
  </g>
</svg>
