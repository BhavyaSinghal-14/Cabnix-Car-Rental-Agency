<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <!-- Background sky sunset gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c1a35"/>
      <stop offset="35%" stop-color="#4e1b43"/>
      <stop offset="70%" stop-color="#a8323c"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>

    <!-- Mountain ridge gradients -->
    <linearGradient id="mountGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a183d"/>
      <stop offset="100%" stop-color="#14020a"/>
    </linearGradient>
    <linearGradient id="mountGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d132c"/>
      <stop offset="100%" stop-color="#080006"/>
    </linearGradient>

    <!-- Highway road gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3436"/>
      <stop offset="100%" stop-color="#111314"/>
    </linearGradient>

    <!-- Sun rays or lens flare -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffeedb" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f5a623" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a8323c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky Base -->
  <rect width="1200" height="600" rx="30" fill="url(#skyGrad)"/>

  <!-- Big Glowing Sun -->
  <circle cx="600" cy="350" r="280" fill="url(#sunGlow)"/>
  <circle cx="600" cy="350" r="50" fill="#ffffff" fill-opacity="0.95"/>

  <!-- Majestic mountains silhouettes in twilight (Layer 1) -->
  <path d="M -100 600 L 150 280 L 450 380 L 780 220 L 1050 365 L 1300 600 Z" fill="url(#mountGrad1)" opacity="0.6"/>

  <!-- Closer mountains silhouettes (Layer 2) -->
  <path d="M -50 600 L 250 320 L 520 410 L 680 340 L 980 440 L 1250 600 Z" fill="url(#mountGrad2)"/>

  <!-- Smooth dynamic sweeping highway lanes -->
  <path d="M -100 600
           C 250 510, 480 450, 600 450
           C 720 450, 950 510, 1300 600
           L 1300 600
           L -100 600 Z" fill="url(#roadGrad)"/>

  <!-- Highway lanes dividers -->
  <!-- Left Side Line -->
  <path d="M -100 598 C 240 508, 470 448, 590 448" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.4"/>
  <!-- Right Side Line -->
  <path d="M 1300 598 C 960 508, 730 448, 610 448" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.4"/>
  <!-- Center dashed line -->
  <path d="M 600 600 L 600 450" stroke="#f5a623" stroke-width="4" stroke-dasharray="20,15" stroke-linecap="round" opacity="0.8"/>

  <!-- Stylized dynamic light streaks representing commutes -->
  <!-- Left to right light streak (headlights) -->
  <path d="M 10 580 C 150 530, 350 490, 520 470" stroke="#ffd700" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.2"/>
  <path d="M 50 540 C 180 500, 380 475, 510 460" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.3"/>
  <!-- Right to left light streak (taillights) -->
  <path d="M 1190 580 C 1050 530, 850 490, 680 470" stroke="#ff4757" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.25"/>
  <path d="M 1150 540 C 1020 500, 820 475, 690 460" stroke="#ff4757" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.3"/>

  <!-- Soft vignette / overlay frame border -->
  <rect x="0" y="0" width="1200" height="600" rx="30" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.1"/>

  <!-- Aesthetic text on bottom center -->
  <g transform="translate(600, 550)" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#ffffff">
    <text font-weight="900" font-size="28" letter-spacing="8" opacity="0.9">CABNIX JOURNEYS</text>
    <text font-weight="500" font-size="14" opacity="0.7" y="24">Experience the open highway in absolute comfort and safety</text>
  </g>
</svg>
