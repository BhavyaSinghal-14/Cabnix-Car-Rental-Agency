<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Beautiful twilight/sunset sky gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1F3D"/>
      <stop offset="40%" stop-color="#5B2E60"/>
      <stop offset="70%" stop-color="#AF4B68"/>
      <stop offset="100%" stop-color="#F39C12"/>
    </linearGradient>

    <!-- Mountain range gradient -->
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#401B4C"/>
      <stop offset="100%" stop-color="#14061A"/>
    </linearGradient>

    <!-- Lake water ripples gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A04060"/>
      <stop offset="30%" stop-color="#552250"/>
      <stop offset="100%" stop-color="#1C0F30"/>
    </linearGradient>

    <!-- Houseboat wood gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7E5109"/>
      <stop offset="100%" stop-color="#4E3104"/>
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F1C40F" stop-opacity="1"/>
      <stop offset="50%" stop-color="#E67E22" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#AF4B68" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="24" fill="url(#skyGrad)"/>

  <!-- Glowing Sun resting behind the peaks -->
  <circle cx="320" cy="310" r="140" fill="url(#sunGlow)"/>
  <circle cx="320" cy="300" r="25" fill="#FFF3CD" fill-opacity="0.95"/>

  <!-- Back Mountain Peaks (Zabarwan range of Srinagar) -->
  <path d="M -50 360 L 100 240 L 220 290 L 350 200 L 480 280 L 610 180 L 710 250 L 850 360 Z" fill="url(#mountainGrad)"/>

  <!-- Water reflection path -->
  <rect x="0" y="340" width="800" height="160" fill="url(#waterGrad)"/>

  <!-- Dynamic Water Ripple Lines -->
  <g stroke="#F39C12" stroke-width="1" opacity="0.3">
    <line x1="100" y1="360" x2="200" y2="360" stroke-linecap="round"/>
    <line x1="280" y1="350" x2="360" y2="350" stroke-linecap="round"/>
    <line x1="420" y1="355" x2="550" y2="355" stroke-linecap="round"/>
    <line x1="150" y1="380" x2="300" y2="380" stroke-width="1.5" stroke="#F1C40F" opacity="0.4"/>
    <line x1="320" y1="370" x2="480" y2="370" stroke-width="2" stroke="#F1C40F" opacity="0.5"/>
    <line x1="50" y1="410" x2="180" y2="410" stroke-linecap="round"/>
    <line x1="520" y1="400" x2="680" y2="400" stroke-linecap="round"/>
    <line x1="250" y1="430" x2="450" y2="430" stroke-width="1.5" stroke="#E67E22" opacity="0.3"/>
  </g>

  <!-- Traditional Kashmiri Houseboat Silhouette resting on Dal Lake -->
  <g transform="translate(480, 250)">
    <!-- Houseboat Wooden Deck/Body -->
    <path d="M 10 90 
             L 280 90 
             L 270 102 
             C 250 108, 50 108, 20 102 Z" fill="url(#woodGrad)"/>
    
    <!-- Houseboat Cabin Roof -->
    <path d="M 40 50 
             L 250 50 
             L 255 54 
             L 255 90 
             L 35 90 
             L 35 54 Z" fill="#6E2C00" stroke="#3E1C00" stroke-width="1"/>
             
    <!-- Roof Carvings and Canopy -->
    <polygon points="35,50 45,35 245,35 255,50" fill="#2E4053"/>
    
    <!-- Traditional lattice windows in the cabin -->
    <g fill="#F5C542" opacity="0.8">
      <rect x="60" y="62" width="18" height="18" rx="2"/>
      <rect x="95" y="62" width="18" height="18" rx="2"/>
      <rect x="130" y="62" width="18" height="18" rx="2"/>
      <rect x="165" y="62" width="18" height="18" rx="2"/>
      <rect x="200" y="62" width="18" height="18" rx="2"/>
    </g>
    <g stroke="#3E1C00" stroke-width="1">
      <line x1="69" y1="62" x2="69" y2="80"/>
      <line x1="60" y1="71" x2="78" y2="71"/>
      <line x1="104" y1="62" x2="104" y2="80"/>
      <line x1="95" y1="71" x2="113" y2="71"/>
      <line x1="139" y1="62" x2="139" y2="80"/>
      <line x1="130" y1="71" x2="148" y2="71"/>
      <line x1="174" y1="62" x2="174" y2="80"/>
      <line x1="165" y1="71" x2="183" y2="71"/>
      <line x1="209" y1="62" x2="209" y2="80"/>
      <line x1="200" y1="71" x2="218" y2="71"/>
    </g>

    <!-- Warm lantern glow reflections in the water -->
    <rect x="60" y="108" width="180" height="25" fill="#FFEAA7" opacity="0.15" filter="blur(2px)"/>
  </g>

  <!-- Traditional Srinagar Shikara Boat profile on the water -->
  <g transform="translate(140, 360)">
    <!-- Shikara Curved Pointed Hull -->
    <path d="M 5 18 
             C 45 18, 90 28, 115 32
             L 190 32
             C 215 28, 260 18, 300 18
             C 230 40, 80 40, 5 18 Z" fill="#4A3115"/>
    
    <!-- Shikara Middle canopy / seating structure -->
    <path d="M 120 18 L 185 18" stroke="#1A120B" stroke-width="4"/>
    <path d="M 115 3 C 130 -8, 175 -8, 190 3 L 195 18 L 110 18 Z" fill="#AF4B68" opacity="0.9"/>
    
    <!-- Rower shadow -->
    <circle cx="255" cy="5" r="8" fill="#1C0F30"/>
    <path d="M 250 13 L 260 13 L 265 24 L 248 24 Z" fill="#1C0F30"/>
    <line x1="250" y1="18" x2="240" y2="38" stroke="#1C0F30" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- High-contrast Foreground Lotus Flowers & Long Mountain Pine Silhouettes -->
  <!-- Left Pine Tree -->
  <g fill="#14061A">
    <polygon points="40,360 20,220 60,220"/>
    <polygon points="40,250 15,160 65,160"/>
    <polygon points="40,180 20,100 60,100"/>
    <rect x="36" y="340" width="8" height="40"/>
  </g>
  <!-- Right Pine Tree -->
  <g fill="#14061A">
    <polygon points="760,380 740,260 780,260"/>
    <polygon points="760,280 735,200 785,200"/>
    <rect x="756" y="360" width="8" height="30"/>
  </g>

  <!-- Subtle Lotus silhouettes on lake -->
  <g fill="#E05B85" opacity="0.8">
    <ellipse cx="80" cy="390" rx="6" ry="2"/>
    <path d="M 80 384 C 77 387, 75 390, 80 392 C 85 390, 83 387, 80 384 Z"/>
    
    <ellipse cx="410" cy="420" rx="8" ry="2.5"/>
    <path d="M 410 412 C 406 416, 404 420, 410 422 C 416 422, 414 416, 410 412 Z"/>
  </g>

  <!-- Elegant title or branding -->
  <g transform="translate(400, 470)" text-anchor="middle">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#FFF3CD" letter-spacing="3" opacity="0.95">SRINAGAR, KASHMIR</text>
  </g>
</svg>
