<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDBB99"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="palace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D98880"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#sky)"/>
  
  <circle cx="620" cy="180" r="80" fill="#F39C12" opacity="0.2"/>

  <!-- Rajput Palace / Fort Silhouette (Warm Terracotta Pink) -->
  <path d="M 50 420 
           L 100 420 
           L 100 300 
           L 150 260 
           L 200 300 
           L 200 420 
           L 350 420 
           L 350 180 
           C 350 150, 450 150, 450 180 
           L 450 420 
           L 600 420 
           L 600 280 
           L 650 240 
           L 700 280 
           L 700 420 
           L 750 420 
           L 750 500 
           L 50 500 Z" fill="url(#palace)"/>

  <!-- Delicate Mughal Archway cutout details -->
  <g fill="#FADBD8" opacity="0.8">
    <path d="M 380 340 A 20 20 0 0 1 420 340 L 420 420 L 380 420 Z"/>
    <path d="M 135 340 A 15 15 0 0 1 165 340 L 165 420 L 135 420 Z"/>
    <path d="M 635 340 A 15 15 0 0 1 665 340 L 665 420 L 635 420 Z"/>
    <path d="M 385 240 A 15 15 0 0 1 415 240 L 415 290 L 385 290 Z"/>
  </g>

  <!-- Palace Domes and spires -->
  <path d="M 125 260 Q 150 210, 175 260 Z" fill="#922B21"/>
  <path d="M 625 240 Q 650 190, 675 240 Z" fill="#922B21"/>
  <path d="M 360 170 Q 400 110, 440 170 Z" fill="#922B21"/>

  <g transform="translate(400, 460)" text-anchor="middle">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#78281F" letter-spacing="3">JAIPUR, ROYAL FORTS</text>
  </g>
</svg>
